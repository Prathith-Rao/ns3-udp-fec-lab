<!doctype html><html><head><meta charset="utf-8"><style>
*{box-sizing:border-box}body{margin:0;font:14px system-ui,sans-serif;color:#20364d;background:#fff} .panel{border:1px solid #d9e3ee;border-radius:14px;padding:14px} .tools{display:flex;align-items:center;gap:10px;flex-wrap:wrap}button,select,input{font:inherit;border:1px solid #becddb;border-radius:7px;padding:6px;background:#fff;color:#20364d}button{cursor:pointer}button:first-child{background:#176b87;color:white;border:0;padding:8px 15px}input[type=range]{flex:1;min-width:150px;padding:0}.badge{background:#eaf2f8;padding:6px 9px;border-radius:6px}.legend{display:flex;gap:16px;flex-wrap:wrap;font-size:12px;padding-top:9px}.dot{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:5px}canvas{width:100%;height:280px;display:block}.hint{font-size:12px;color:#5b7086;margin:8px 0 0}
</style></head><body><div class="panel"><div class="tools"><button id="play">Play</button><button id="reset">Reset</button><select id="speed"><option value=".02">0.02×</option><option value=".1" selected>0.1×</option><option value=".5">0.5×</option><option value="1">1×</option><option value="2">2×</option></select><input id="time" type="range" min="0.9" step="0.001"><span id="clock" class="badge"></span><label>Packet <input id="focus" type="number" min="-1" value="-1" style="width:75px"></label></div><canvas id="net"></canvas><div class="legend"><span><i class="dot" style="background:#216cb2"></i>DATA</span><span><i class="dot" style="background:#ad7200"></i>PARITY</span><span><i class="dot" style="background:#7855b3"></i>FEEDBACK</span><span><i class="dot" style="background:#159879"></i>RECOVERED at receiver</span><span><i class="dot" style="background:#d34545"></i>DROPPED</span><span id="config" class="badge"></span></div><p class="hint">Replay of recorded ns-3 events. Transit positions interpolate between recorded times. Packet −1 shows all traffic. Recovery is a receiver operation, not a packet crossing a link.</p></div><script>
const data=__TRACE_DATA__;
const canvas=document.getElementById('net'),ctx=canvas.getContext('2d'),slider=document.getElementById('time');
slider.max=data.end;slider.value=.9;let now=.9,playing=false,last=0;
const colours={DATA:'#216cb2',PARITY:'#ad7200',FEEDBACK:'#7855b3'};
document.getElementById('play').onclick=()=>{playing=!playing;document.getElementById('play').textContent=playing?'Pause':'Play';};
document.getElementById('reset').onclick=()=>{now=.9;playing=false;document.getElementById('play').textContent='Play';slider.value=now;};
slider.oninput=()=>{now=Number(slider.value);playing=false;document.getElementById('play').textContent='Play';};
function text(s,x,y,size=14,color='#20364d'){ctx.fillStyle=color;ctx.font=size+'px system-ui';ctx.textAlign='center';ctx.fillText(s,x,y);}
function circle(x,y,r,color){ctx.beginPath();ctx.arc(x,y,r,0,2*Math.PI);ctx.fillStyle=color;ctx.fill();}
function draw(){const w=canvas.clientWidth,h=280,dpr=window.devicePixelRatio||1;if(canvas.width!==w*dpr){canvas.width=w*dpr;canvas.height=h*dpr;}ctx.setTransform(dpr,0,0,dpr,0,0);ctx.clearRect(0,0,w,h);
 const xs=[w*.13,w*.5,w*.87],y=135;ctx.strokeStyle='#b6c8d9';ctx.lineWidth=3;ctx.beginPath();ctx.moveTo(xs[0],y);ctx.lineTo(xs[2],y);ctx.stroke();
 text('5 Mbps · 2 ms',(xs[0]+xs[1])/2,y-45,12,'#637a90');text('2 Mbps · 20 ms',(xs[1]+xs[2])/2,y-45,12,'#637a90');
 const focus=Number(document.getElementById('focus').value),selected=data.paths.find(p=>p.kind==='DATA'&&p.seq===focus),block=selected?selected.block:-1;
 for(const p of data.paths){if(focus>=0&&p.seq!==focus&&p.block!==block&&p.kind!=='FEEDBACK')continue;
  for(let i=0;i<p.points.length-1;i++){const a=p.points[i],b=p.points[i+1];if(now>=a.t&&now<=b.t){const fraction=(now-a.t)/Math.max(.000001,b.t-a.t),x=xs[a.node]+fraction*(xs[b.node]-xs[a.node]);circle(x,y-8,6,colours[p.kind]);text(p.kind==='DATA'?String(p.seq):p.kind[0],x,y-21,10,colours[p.kind]);}}
  const end=p.points[p.points.length-1];if(p.status==='drop'&&now>=end.t&&now<end.t+.24){text('×',xs[end.node]-65,y-7,32,'#d34545');text('lost '+p.seq,xs[end.node]-65,y+17,11,'#d34545');}}
 for(let i=0;i<3;i++){circle(xs[i],y,25,['#176b87','#bf8a2d','#21806b'][i]);text(String(i),xs[i],y+5,16,'white');text(['Audio sender','Router','Receiver'][i],xs[i],y+49,14);}
 for(const r of data.recoveries){if((focus<0||r.seq===focus)&&now>=r.t&&now<r.t+.45){ctx.strokeStyle=r.late?'#bd6d16':'#159879';ctx.lineWidth=4;ctx.beginPath();ctx.arc(xs[2],y,31,0,Math.PI*2);ctx.stroke();text('Recovered '+r.seq+(r.late?' · late':''),xs[2],y+77,12,r.late?'#bd6d16':'#159879');}}
 const frames=data.frames.filter(f=>f.t<=now),f=frames[frames.length-1];document.getElementById('config').textContent=f?'Active: '+(f.k===1?'no parity':'k='+f.k)+' · depth='+f.d:'Waiting for source';document.getElementById('clock').textContent=now.toFixed(3)+' s';
}
function tick(stamp){if(last&&playing){now+=Math.min(.1,(stamp-last)/1000)*Number(document.getElementById('speed').value);if(now>=data.end){now=data.end;playing=false;document.getElementById('play').textContent='Play';}slider.value=now;}last=stamp;draw();requestAnimationFrame(tick);}requestAnimationFrame(tick);
</script></body></html>
